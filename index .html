<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#6b7480;--bd:#e2e5ea;--ac:#c85a2e;--ac2:#fbece4}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171a;--card:#1e2327;--tx:#e8ebee;--mu:#9aa4af;--bd:#2f363d;--ac:#e8845a;--ac2:#33231b}}
:root{color-scheme:light dark}:root[data-theme="light"]{color-scheme:light}:root[data-theme="dark"]{color-scheme:dark}
:root[data-theme="dark"]{--bg:#14171a;--card:#1e2327;--tx:#e8ebee;--mu:#9aa4af;--bd:#2f363d;--ac:#e8845a;--ac2:#33231b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--bd);padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1{font-size:18px;margin:0;color:var(--ac)}.sp{margin-left:auto;display:flex;gap:6px;align-items:center}
main{max-width:1000px;margin:0 auto;padding:16px}.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.row>*{flex:1 1 150px}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:3px}
input,select{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit}.btn.p{background:var(--ac);color:#fff;border-color:var(--ac)}.sm{padding:3px 8px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}.stat{background:var(--ac2);border-radius:10px;padding:10px}.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--mu)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:640px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);vertical-align:top}th{font-size:12px;color:var(--mu)}
.tag{padding:2px 8px;border-radius:99px;font-size:12px;background:var(--bd)}.Completed{background:#cfeedd;color:#0a5a33}.Pickedup{background:#d8e6fb;color:#1a4a8a}.Noanswer{background:#fbd9d9;color:#8a1a1a}.Assigned{background:#fdf0c9;color:#7a5a00}
h2{font-size:16px;margin:0 0 10px}.mu{color:var(--mu);font-size:13px}a{color:var(--ac)}
.toast{position:fixed;left:12px;right:12px;bottom:12px;background:#1b1f24;color:#fff;padding:12px;border-radius:10px;display:none;z-index:999}
.sw{touch-action:pan-y;user-select:none;transition:transform .15s}.av{width:72px;height:72px;border-radius:50%;object-fit:cover;background:var(--bd);display:flex;align-items:center;justify-content:center;font-size:28px;flex:0 0 72px}
.vb{background:#1d9bf0;color:#fff;border-radius:99px;padding:1px 8px;font-size:12px;margin-left:6px}.vb.no{background:var(--bd);color:var(--mu)}#map{height:340px;border-radius:10px}
body.auth{background:#fff}
body.auth::before{content:"";position:fixed;inset:0;background:url("login-bg.jpg") center/cover no-repeat;z-index:-1}
body.auth .card{box-shadow:0 8px 28px rgba(0,0,0,.16)}
.rid{font-size:24px;text-align:center;line-height:30px;filter:drop-shadow(0 1px 2px #0006)}.rid.old{opacity:.45}
.chatwin{position:fixed;right:16px;bottom:16px;width:360px;height:480px;max-width:calc(100vw - 24px);max-height:calc(100vh - 24px);z-index:60;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.28);display:flex;flex-direction:column;overflow:hidden}
@media(max-width:480px){.chatwin{left:8px;right:8px;bottom:8px;width:auto;height:70vh}}

function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',5000)}
async function q(p){const r=await p;if(r.error){toast(r.error.message);throw r.error}return r.data}
const badge=s=>`<span class="tag ${s.replace(' ','')}">${s}</span>`;
async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session){authV();return}
 me=await q(sb.from('profiles').select('*').eq('id',session.user.id).single());
 try{const l=localStorage.getItem('dh_lic');if(l&&!me.license&&me.wants==='rider'){await q(sb.from('profiles').update({license:l}).eq('id',me.id));me.license=l;localStorage.removeItem('dh_lic')}}catch(x){}
 await load();notifyNew();render();if(me.role!=='pending')subscribe();try{if(me.role==='rider'&&localStorage.getItem('dh_share')==='1')toggleShare()}catch(x){}}
async function load(){if(me.role==='pending')return;
 D.bank=await q(sb.from('company_bank').select('*').eq('id',1).single());
 D.reqs=await q(sb.from('requests').select('*').order('created_at',{ascending:false}));
 if(me.role==='rider'||me.role==='admin'){const c=await sb.from('chat_messages').select('*').order('created_at',{ascending:false}).limit(500);chatErr=c.error?c.error.message:'';D.chat=c.error?[]:c.data.reverse()}
 if(me.role==='admin'){D.users=await q(sb.from('profiles').select('*').order('created_at'));D.msgs=await q(sb.from('messages').select('*').order('created_at',{ascending:false}).limit(30));{const r=await sb.from('rider_locations').select('*');D.locs=r.error?[]:r.data}}}
async function refresh(){await load();notifyNew();render()}
function render(){document.body.classList.remove('auth');if(recovering)return resetV();pmap=null;pmk=null;$('#hd').innerHTML=`<span class="mu">${esc(me.name)} (${me.role})</span>${('Notification' in window&&Notification.permission==='default')?'<button class="btn sm" onclick="askNotif()">🔔 Alerts</button>':''}<button class="btn sm" onclick="refresh()">Refresh</button><button class="btn sm" onclick="logout()">Log out</button>`;
 $('#app').innerHTML=me.role==='shop'?shopV():me.role==='rider'?riderV():me.role==='admin'?adminV():pendV();
 if(me.role==='rider'){bindSwipe();openMaps.forEach(id=>initOrderMap(id))}if(me.role==='admin')initMap()}
setInterval(pollNow,30000);

function alertUser(m){toast(m);beep();try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
 if(document.hidden){unread++;document.title='('+unread+') Delivery House';
  if(window.Notification&&Notification.permission==='granted'){const o={body:m,icon:LOGO,tag:'dh',renotify:true};
   (navigator.serviceWorker?navigator.serviceWorker.getRegistration():Promise.resolve(null)).then(r=>r?r.showNotification('Delivery House',o):new Notification('Delivery House',o)).catch(()=>{})}}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){unread=0;document.title='Delivery House'}});
function askNotif(){if(window.Notification)Notification.requestPermission().then(()=>render())}
function notifyNew(){if(!me||me.role==='pending')return;if(me.role==='rider'||me.role==='admin')notifyChat();const cur=new Map(D.reqs.map(r=>[r.id,r.rider_id||null]));
 if(prev===null){prev=cur;return}
 const m=[];D.reqs.forEach(r=>{const had=prev.has(r.id),old=prev.get(r.id)||null;
  if(me.role==='admin'){if(!had)m.push('New order '+ono(r)+' from '+r.shop_name);else if(!old&&r.rider_id&&!mine.has(r.id))m.push('A rider was assigned to '+ono(r))}
  else if(me.role==='rider'){if(!had||(r.rider_id===me.id&&old!==me.id))m.push('Order '+ono(r)+' assigned to you')}
  else if(me.role==='shop'){if(!old&&r.rider_id)m.push('A rider was assigned to your order '+ono(r))}});
 prev=cur;if(m.length)alertUser(m.length>1?m.length+' updates: '+m[0]+' and more':m[0])}
async function pollNow(){if(!me||me.role==='pending')return;const busy=fo||document.activeElement.matches('input,select');await load();notifyNew();if(chatOpen){drawChat(true);markRead()}if(!busy)render()}
function subscribe(){if(window._ch)return;let t=null;const cb=()=>{clearTimeout(t);t=setTimeout(pollNow,600)};try{window._ch=sb.channel('req-changes').on('postgres_changes',{event:'*',schema:'public',table:'requests'},cb).on('postgres_changes',{event:'*',schema:'public',table:'chat_messages'},cb).subscribe()}catch(e){}}
function rv(m){const a=m.filter(r=>(!rf.shop||r.shop_name===rf.shop)&&(!rf.from||new Date(r.created_at)>=new Date(rf.from+'T00:00:00'))&&(!rf.to||new Date(r.created_at)<=new Date(rf.to+'T23:59:59.999')));
 const t=r=>new Date(r.created_at);return a.sort((x,y)=>rf.sort==='old'?t(x)-t(y):rf.sort==='shop'?(x.shop_name||'').localeCompare(y.shop_name||'')||t(y)-t(x):t(y)-t(x))}
/* CHAT */
const ctime=d=>new Date(d).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const nameOf=id=>(D.users.find(u=>u.id===id)||{name:'Rider'}).name;
const unreadFor=rid=>D.chat.filter(m=>m.rider_id===rid&&!m.read&&m.sender_role===(me.role==='admin'?'rider':'admin')).length;
function chatList(){const rs=D.users.filter(u=>u.role==='rider').map(u=>{const th=D.chat.filter(m=>m.rider_id===u.id);return{u,last:th[th.length-1],un:unreadFor(u.id)}});
 rs.sort((a,b)=>(b.last?new Date(b.last.created_at):0)-(a.last?new Date(a.last.created_at):0));
 return rs.map(({u,last,un})=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)"><div><b>${esc(u.name)}</b>${un?` <span class="tag" style="background:var(--ac);color:#fff">${un} new</span>`:''}<div class="mu">${last?esc(last.body.slice(0,50)):'No messages yet'}</div></div><button class="btn sm" onclick="openChat('${u.id}')">Open</button></div>`).join('')||'<span class="mu">No riders yet.</span>'}
function threadFor(){const rid=me.role==='rider'?me.id:chatRider;return D.chat.filter(m=>m.rider_id===rid)}
function openChat(rid){if(me.role==='admin')chatRider=rid;chatOpen=true;drawChat();markRead()}
function closeChat(){chatOpen=false;chatRider=null;document.getElementById('chatbox').innerHTML='';render()}
function drawChat(partial){const box=document.getElementById('chatbox');if(!chatOpen){box.innerHTML='';return}
 const list=threadFor().map(m=>{const mi=m.sender_id===me.id;return `<div style="display:flex;justify-content:${mi?'flex-end':'flex-start'};margin:4px 0"><div style="max-width:80%;padding:8px 10px;border-radius:12px;background:${mi?'var(--ac)':'var(--bg)'};color:${mi?'#fff':'var(--tx)'};word-break:break-word">${esc(m.body)}<div style="font-size:10px;opacity:.7;text-align:right">${ctime(m.created_at)}</div></div></div>`}).join('')||'<div class="mu" style="text-align:center;margin-top:20px">No messages yet. Say hello!</div>';
 const cm=document.getElementById('cm');
 if(partial&&cm){const end=cm.scrollHeight-cm.scrollTop-cm.clientHeight<80;cm.innerHTML=list;if(end)cm.scrollTop=cm.scrollHeight;return}
 box.innerHTML=`<div class="chatwin"><div style="padding:12px 14px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center"><b>💬 ${me.role==='admin'?esc(nameOf(chatRider)):'Admin'}</b><button class="btn sm" onclick="closeChat()">Close</button></div><div id="cm" style="flex:1;overflow-y:auto;padding:10px 12px">${list}</div><div style="padding:10px;border-top:1px solid var(--bd);display:flex;gap:8px"><input id="ci" placeholder="Type a message" maxlength="2000" onkeydown="if(event.key==='Enter')sendChat()"><button class="btn p" onclick="sendChat()">Send</button></div></div>`;
 const c2=document.getElementById('cm');c2.scrollTop=c2.scrollHeight}
async function sendChat(){const i=document.getElementById('ci'),t=i.value.trim();if(!t)return;const rid=me.role==='rider'?me.id:chatRider;i.value='';
 const{error}=await sb.from('chat_messages').insert({rider_id:rid,body:t});if(error){toast(error.message);i.value=t;return}
 await load();drawChat(true);i.focus()}
async function markRead(){const rid=me.role==='rider'?me.id:chatRider,other=me.role==='admin'?'rider':'admin';
 if(!D.chat.some(m=>m.rider_id===rid&&m.sender_role===other&&!m.read))return;
 D.chat.forEach(m=>{if(m.rider_id===rid&&m.sender_role===other)m.read=true});
 await sb.from('chat_messages').update({read:true}).eq('rider_id',rid).eq('sender_role',other).eq('read',false)}
function notifyChat(){const ids=new Set(D.chat.map(m=>m.id));if(prevChat===null){prevChat=ids;return}
 const fresh=D.chat.filter(m=>!prevChat.has(m.id)&&m.sender_id!==me.id);prevChat=ids;
 fresh.forEach(m=>{const open=chatOpen&&!document.hidden&&(me.role==='rider'||chatRider===m.rider_id);if(open)return;
  alertUser('💬 '+(me.role==='admin'?nameOf(m.rider_id):'Admin')+': '+m.body.slice(0,60))})}
function bindSwipe(){document.querySelectorAll('.sw').forEach(el=>{let x0=null,dx=0;
 el.addEventListener('pointerdown',e=>{if(e.target.closest('input,select,a,button,.leaflet-container'))return;x0=e.clientX;dx=0});
 el.addEventListener('pointermove',e=>{if(x0===null)return;dx=e.clientX-x0;el.style.transform=`translateX(${Math.max(-120,Math.min(120,dx))}px)`});
 const end=()=>{if(x0===null)return;const d=dx;x0=null;el.style.transform='';if(Math.abs(d)<90)return;const r=D.reqs.find(q=>q.id===el.dataset.id);if(!r)return;
  if(d<0){if(r.status!=='Completed')upd(r.id,{status:'No answer'})}else{const nx={'Assigned':'Picked up','No answer':'Picked up','Picked up':'Completed'}[r.status];if(nx)upd(r.id,{status:nx})}};
 ['pointerup','pointercancel','pointerleave'].forEach(t=>el.addEventListener(t,end))})}

/* ADMIN */
function adminV(){const R=D.reqs,riders=D.users.filter(u=>u.role==='rider'),b=D.bank;
 return `<div class="stats"><div class="stat"><b>${R.length}</b><span>All requests</span></div><div class="stat"><b>${R.filter(r=>r.status==='Pending').length}</b><span>Unassigned</span></div><div class="stat"><b>${R.filter(r=>r.status==='Completed').length}</b><span>Completed</span></div><div class="stat"><b>${mvr(R.filter(r=>r.status==='Completed').reduce((a,r)=>a+Number(r.price),0))}</b><span>Completed value</span></div></div>
 <div class="card"><h2>Dispatch</h2><div class="tw"><table><tr><th>Shop / Recipient</th><th>Address</th><th>Status</th><th>Rider</th><th>Price</th><th>Proof / Pin</th></tr>
 ${R.map(r=>`<tr><td><span class="tag">${ono(r)}</span> <b>${esc(r.shop_name)}</b><br>${esc(r.name)}<br><span class="mu">${esc(r.contact)}</span></td><td>${esc(r.address)}<br><span class="mu">${esc(r.landmark)}</span>${locInfo(r)}</td>
 <td><select onchange="upd('${r.id}',{status:this.value})">${STAT.map(s=>`<option ${s===r.status?'selected':''}>${s}</option>`).join('')}</select></td>
 <td><select onchange="assign('${r.id}',this.value)"><option value="">Unassigned</option>${riders.map(x=>`<option value="${x.id}" ${x.id===r.rider_id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></td>
 <td><input type="number" min="0" step="0.5" value="${r.price}" style="width:85px" onchange="upd('${r.id}',{price:+this.value})"></td>
 <td>${r.proof?`<a href="#" onclick="showDoc(D.reqs.find(q=>q.id==='${r.id}').proof);return false">Proof</a><br>`:''}<button class="btn sm" onclick="pinFor='${r.id}';toast('Click the map to place the pin');$('#map').scrollIntoView()">${r.lat?'Move pin':'Set pin'}</button></td></tr>`).join('')||'<tr><td colspan=6 class="mu">No requests yet</td></tr>'}</table></div></div>
 <div class="card"><h2>Rider chats</h2>${chatErr?`<div style="color:#b3261e;margin-bottom:8px">Chat problem: ${esc(chatErr)}. Run update-chat.sql in Supabase, then refresh.</div>`:''}${chatList()}</div>
 <div class="card"><h2>Delivery map</h2><div id="map"></div><h2 style="margin-top:12px">Riders on duty</h2><div id="rl"></div></div>
 <div class="card"><h2>Users</h2><div class="tw"><table><tr><th>Name / Phone</th><th>Applied as</th><th>Role</th><th>Price per delivery (shops)</th><th>Rider badge</th></tr>
 ${D.users.map(u=>`<tr><td>${esc(u.name)}<br><span class="mu">${esc(u.phone)}</span>${u.business_name?`<br><span class="mu">${esc(u.business_name)} · ${esc(u.business_type)} · ${esc(u.business_address)}, ${esc(u.business_location)}</span>`:''}${u.license?`<br><a href="#" onclick="showDoc(D.users.find(q=>q.id==='${u.id}').license);return false">View license</a>`:(u.wants==='rider'?'<br><span class="mu">No license uploaded</span>':'')}</td><td>${esc(u.wants)}</td>
 <td><select onchange="up('${u.id}',{role:this.value})">${['pending','shop','rider','admin'].map(r=>`<option ${r===u.role?'selected':''}>${r}</option>`).join('')}</select></td>
 <td>${u.role==='shop'?`<input type="number" min="0" step="0.5" value="${u.rate}" style="width:90px" onchange="up('${u.id}',{rate:+this.value})">`:'-'}</td>
 <td>${u.role==='rider'?`<button class="btn sm" onclick="up('${u.id}',{verified:${!u.verified}})">${u.verified?'✔ Verified (remove)':'Verify'}</button>`:'-'}</td></tr>`).join('')}</table></div></div>
 <div class="card"><h2>Bank details (printed on invoices)</h2><div class="row">${[['bank','Bank'],['name','Account name'],['acc','Account number'],['note','Payment note']].map(([k,l])=>`<div><label>${l}</label><input value="${esc(b[k])}" onchange="ub('${k}',this.value)"></div>`).join('')}</div></div>
 <div class="card"><h2>Customer messages (queued)</h2>${D.msgs.map(m=>`<div class="mu" style="margin-bottom:6px"><b>${esc(m.to_number)}</b> ${dt(m.created_at)} ${m.sent?'(sent)':'(queued)'}: ${esc(m.body)}</div>`).join('')||'<span class="mu">None yet</span>'}</div>`}
const assign=(id,v)=>{mine.add(id);return upd(id,v?{rider_id:v,status:'Assigned'}:{rider_id:null,status:'Pending'})};
async function up(id,p){await q(sb.from('profiles').update(p).eq('id',id));refresh()}
async function ub(k,v){await q(sb.from('company_bank').update({[k]:v}).eq('id',1));D.bank[k]=v}
const ago=t=>{const m=Math.round((Date.now()-new Date(t))/60000);return m<1?'just now':m<60?m+' min ago':Math.round(m/60)+' h ago'};
function drawRiders(){if(!rlayer)return;rlayer.clearLayers();const nm=id=>D.users.find(x=>x.id===id)||{name:'Rider',phone:''};
 D.locs.forEach(l=>{const u=nm(l.rider_id),old=Date.now()-new Date(l.updated_at)>300000;
  L.marker([l.lat,l.lng],{icon:L.divIcon({html:'🛵',className:'rid'+(old?' old':''),iconSize:[30,30]})}).addTo(rlayer).bindPopup(`<b>${esc(u.name)}</b><br>${esc(u.phone)}<br>${old?'Last seen ':'Updated '}${ago(l.updated_at)}`)});
 const el=document.getElementById('rl');if(el)el.innerHTML=D.locs.length?D.locs.map(l=>`<div style="margin-bottom:4px">🛵 <b>${esc(nm(l.rider_id).name)}</b> <span class="mu">${ago(l.updated_at)}</span> <a href="#" onclick="focusRider('${l.rider_id}');return false">Show on map</a></div>`).join(''):'<span class="mu">No riders are sharing their location right now.</span>'}
function focusRider(id){const l=D.locs.find(x=>x.rider_id===id);if(l&&amap){amap.setView([l.lat,l.lng],16);document.getElementById('map').scrollIntoView()}}
async function loadLocs(){if(!me||me.role!=='admin')return;try{const{data,error}=await sb.from('rider_locations').select('*');if(!error){D.locs=data;drawRiders()}}catch(e){}}
setInterval(loadLocs,10000);
function initMap(){const m=L.map('map').setView(mapView?mapView.c:[4.1755,73.5093],mapView?mapView.z:12);m.on('moveend',()=>{mapView={c:m.getCenter(),z:m.getZoom()}});rlayer=L.layerGroup().addTo(m);amap=m;L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(m);
 D.reqs.filter(r=>r.lat).forEach(r=>L.marker([r.lat,r.lng]).addTo(m).bindPopup(`<b>${esc(r.shop_name)}</b><br>${esc(r.name)}<br>${esc(r.address)}<br>${r.status}`));
 m.on('click',async e=>{if(!pinFor)return;const id=pinFor;pinFor=null;await upd(id,{lat:e.latlng.lat,lng:e.latlng.lng})});drawRiders()}
function isDark(){const t=document.documentElement.getAttribute('data-theme');return t?t==='dark':matchMedia('(prefers-color-scheme:dark)').matches}
function applyTheme(t){if(t)document.documentElement.setAttribute('data-theme',t);$('#tg').textContent=isDark()?'☀️ Light':'🌙 Dark'}
function toggleTheme(){const t=isDark()?'light':'dark';try{localStorage.setItem('dh_theme',t)}catch(e){}applyTheme(t)}
{let t=null;try{t=localStorage.getItem('dh_theme')}catch(e){}applyTheme(t)}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
</script></body></html>
